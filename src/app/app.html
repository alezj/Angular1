<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="isMenuOpen()">
    <div class="sidebar-header">
      <div class="logo-container">
        <!-- Angular Icon SVG -->
        <svg class="angular-logo" viewBox="0 0 250 250" width="32" height="32">
          <path fill="#DD0031" d="M125 30L15 80l22 136 88 48 88-48 22-136z"/>
          <path fill="#C3002F" d="M125 30v222l88-48 22-136z"/>
          <path fill="#FFF" d="M125 55L66 185h25l12-30h44l12 30h25zM113 125l12-28 12 28z"/>
        </svg>
        <span class="logo-text">Angular1</span>
      </div>
      <button class="close-btn" (click)="closeMenu()" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <nav class="nav-menu">
      <a routerLink="/pruebas" routerLinkActive="active" (click)="closeMenu()" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3m0 14.5L5.26 14 3 15.22 12 20l9-4.78-2.26-1.22L12 17.5z"/>
        </svg>
        <span>Pruebas</span>
      </a>

      <a routerLink="/search" routerLinkActive="active" (click)="closeMenu()" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span>Búsqueda</span>
      </a>

      <a routerLink="/custom" routerLinkActive="active" (click)="closeMenu()" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
        </svg>
        <span>Custom</span>
      </a>

      <a routerLink="/contar" routerLinkActive="active" (click)="closeMenu()" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
        </svg>
        <span>Contador</span>
      </a>
    </nav>
  </aside>

  <!-- Overlay for Mobile Drawer -->
  <div class="sidebar-overlay" [class.visible]="isMenuOpen()" (click)="closeMenu()"></div>

  <!-- Main Area -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <h1 class="topbar-title">Módulo de Muestras</h1>
      <div class="topbar-actions">
        <!-- Angular Icon (Mini) -->
        <span class="badge">v20.1</span>
      </div>
    </header>

    <main class="content-container">
      <div class="card fade-in">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
