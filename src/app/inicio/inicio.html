<section class="inicio-page">
  <div class="hero">
    <div>
      <p class="eyebrow">Panel principal</p>
      <h2>Dashboard</h2>
      <p class="hero-text">Resumen general de tu cartera y actividad inmobiliaria.</p>
    </div>
  </div>

  <div class="summary-grid" *ngIf="!cargando">
    <div class="summary-card" *ngFor="let item of summaryCards">
      <span class="summary-icon" [attr.data-tone]="item.tone" aria-hidden="true">{{ item.icon }}</span>
      <span class="summary-label">{{ item.label }}</span>
      <strong class="summary-value">{{ item.value }}</strong>
    </div>
  </div>

  <p class="status" *ngIf="cargando">Cargando resumen...</p>
  <p class="status error" *ngIf="error">{{ error }}</p>

  <div class="dashboard-section-heading">
    <h3>Accesos rápidos</h3>
  </div>

  <div class="dashboard-grid">
    <a class="dashboard-card" *ngFor="let card of dashboardCards" [routerLink]="card.link">
      <h3>{{ card.title }}</h3>
      <p>{{ card.description }}</p>
      <span>Ver detalles →</span>
    </a>
  </div>
</section>
