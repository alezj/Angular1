<section class="inquilinos">
  <h2>Inquilinos</h2>
  <form (ngSubmit)="guardar()" class="formulario">
    <input class="filter-input" [(ngModel)]="formulario.nombreApellido" name="nombre" placeholder="Nombre" required>
    <input class="filter-input" [(ngModel)]="formulario.fechaInicioContrato" name="inicio" type="date" required>
    <input class="filter-input" [(ngModel)]="formulario.fechaPagos" name="dia" type="number" min="1" max="31" required>
    <button class="filter-button" type="submit">{{ editandoId === null ? 'Crear' : 'Guardar' }}</button>
    <button class="filter-button secondary" *ngIf="editandoId !== null" type="button" (click)="cancelar()">Cancelar</button>
  </form>

  <div class="filter-bar">
    <input class="filter-input" [(ngModel)]="searchTerm" name="search" placeholder="Buscar inquilinos..." />
  </div>

  <p *ngIf="cargando">Cargando inquilinos...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="table-wrapper" *ngIf="!cargando && !error">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre y apellido</th>
          <th>Inicio de contrato</th>
          <th>Día de pago</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let inquilino of inquilinos">
          <td>{{ inquilino.id }}</td>
          <td>{{ inquilino.nombreApellido }}</td>
          <td>{{ inquilino.fechaInicioContrato | date: 'dd/MM/yyyy' }}</td>
          <td>{{ inquilino.fechaPagos }}</td>
          <td>
            <div class="action-buttons">
              <button class="filter-button" (click)="editar(inquilino)">Editar</button>
              <button class="filter-button secondary delete-button" (click)="eliminar(inquilino.id)">Eliminar</button>
            </div>
          </td>
        </tr>
        <tr *ngIf="inquilinos.length === 0">
          <td colspan="5">No hay inquilinos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
