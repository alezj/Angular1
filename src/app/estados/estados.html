<div class="page">
  <h2>Catálogo de Estados</h2>

  <form (ngSubmit)="guardar()" class="form-inline filter-bar">
    <input class="filter-input" [(ngModel)]="formulario.nombre" name="nombre" placeholder="Nombre del estado" required />
    <button class="filter-button" type="submit">{{ editandoId === null ? 'Crear' : 'Actualizar' }}</button>
    <button class="filter-button secondary" type="button" (click)="cancelar()">Cancelar</button>
  </form>

  <div *ngIf="cargando">Cargando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!cargando && estados.length > 0" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of estados">
        <td>{{ e.id }}</td>
        <td>{{ e.nombre }}</td>
        <td>
          <button class="filter-button" (click)="editar(e)">Editar</button>
          <button class="filter-button secondary" (click)="eliminar(e.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!cargando && estados.length === 0">No hay estados definidos.</div>
</div>
