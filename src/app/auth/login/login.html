<div class="auth-viewport">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo">
        <span class="logo-icon">🏢</span>
        <div class="logo-text">
          <h1>Nexus CRM</h1>
          <p class="subtitle">Gestión Inmobiliaria Inteligente</p>
        </div>
      </div>

      <!-- Selector de Modo (Tabs) -->
      <div class="auth-tabs" role="tablist">
        <button
          type="button"
          class="tab-btn"
          [class.active]="!isRegistro"
          (click)="toggleModo(false)"
          role="tab"
          [attr.aria-selected]="!isRegistro"
        >
          Iniciar Sesión
        </button>
        <button
          type="button"
          class="tab-btn"
          [class.active]="isRegistro"
          (click)="toggleModo(true)"
          role="tab"
          [attr.aria-selected]="isRegistro"
        >
          Registrarse
        </button>
      </div>
    </div>

    <!-- Mensajes de feedback -->
    <div *ngIf="errorMensaje" class="alert alert-danger" role="alert">
      <span class="alert-icon">⚠️</span>
      <span>{{ errorMensaje }}</span>
    </div>

    <div *ngIf="exitoMensaje" class="alert alert-success" role="status">
      <span class="alert-icon">✅</span>
      <span>{{ exitoMensaje }}</span>
    </div>

    <!-- Formulario -->
    <form (submit)="handleSubmit($event)" class="auth-form" novalidate>
      <!-- Campo Nombre Completo (solo en registro) -->
      <div *ngIf="isRegistro" class="form-group">
        <label for="nombreCompleto">Nombre Completo</label>
        <input
          type="text"
          id="nombreCompleto"
          name="nombreCompleto"
          [(ngModel)]="nombreCompleto"
          required
          autocomplete="name"
          placeholder="Ej. Carlos Mendoza"
          class="form-input"
        />
      </div>

      <!-- Campo Teléfono (solo en registro) -->
      <div *ngIf="isRegistro" class="form-group">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          [(ngModel)]="telefono"
          autocomplete="tel"
          inputmode="tel"
          placeholder="+1 (555) 019-2834"
          class="form-input"
        />
      </div>

      <!-- Campo Rol Inicial (solo en registro) -->
      <div *ngIf="isRegistro" class="form-group">
        <label for="rolSeleccionado">Rol en la Empresa</label>
        <select
          id="rolSeleccionado"
          name="rolSeleccionado"
          [(ngModel)]="rolSeleccionado"
          class="form-input select-input"
        >
          <option *ngFor="let r of authService.roles()" [value]="r.id">
            {{ r.name }}
          </option>
          <option *ngIf="authService.roles().length === 0" value="agente">
            Agente Inmobiliario
          </option>
        </select>
        <span class="field-hint">El primer usuario que se registre será Super Administrador automáticamente.</span>
      </div>

      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <span id="email-hint" class="field-hint">Ingresa tu correo institucional o personal</span>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          inputmode="email"
          aria-describedby="email-hint"
          placeholder="nombre@inmobiliaria.com"
          class="form-input"
        />
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <span *ngIf="isRegistro" id="password-hint" class="field-hint">Mínimo 6 caracteres</span>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          [attr.autocomplete]="isRegistro ? 'new-password' : 'current-password'"
          [attr.aria-describedby]="isRegistro ? 'password-hint' : null"
          placeholder="••••••••"
          class="form-input"
        />
      </div>

      <!-- Botón de Envío -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="cargando || !email || !password"
      >
        <span *ngIf="cargando" class="spinner"></span>
        <span *ngIf="!cargando">{{ isRegistro ? 'Crear Cuenta en el CRM' : 'Acceder al CRM' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <p *ngIf="!isRegistro">
        ¿Aún no tienes cuenta?
        <button type="button" class="link-btn" (click)="toggleModo(true)">Regístrate aquí</button>
      </p>
      <p *ngIf="isRegistro">
        ¿Ya tienes cuenta creada?
        <button type="button" class="link-btn" (click)="toggleModo(false)">Inicia sesión aquí</button>
      </p>
    </div>
  </div>
</div>
