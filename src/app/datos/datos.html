<div>
  <h2>Datos de la hoja</h2>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error">{{ error }}</p>

  <div class="filter-bar">
    <input class="filter-input" [value]="searchTerm()" (input)="searchTerm.set($event.target.value)" placeholder="Buscar datos..." />
  </div>

  <table *ngIf="!cargando && !error">
    <thead>
      <tr>
        <th *ngFor="let encabezado of datos[0]">{{ encabezado }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fila of filteredRows()">
        <td *ngFor="let celda of fila">{{ celda }}</td>
      </tr>
      <tr *ngIf="filteredRows().length === 0">
        <td [attr.colspan]="datos[0]?.length || 1">No hay registros que coincidan con la búsqueda.</td>
      </tr>
    </tbody>
  </table>
</div>
