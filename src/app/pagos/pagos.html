<section class="pagos">
  <h2>Pagos</h2>

  <p *ngIf="cargando">Cargando pagos...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="table-wrapper" *ngIf="!cargando && !error">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>ID de inquilino</th>
          <th>Fecha de pago</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pago of pagos">
          <td>{{ pago.id }}</td>
          <td>{{ pago.idInquilino || '-' }}</td>
          <td>{{ pago.fechaPago ? (pago.fechaPago | date: 'dd/MM/yyyy') : '-' }}</td>
          <td>{{ pago.monto === '' ? '-' : (pago.monto | number: '1.2-2') }}</td>
        </tr>
        <tr *ngIf="pagos.length === 0">
          <td colspan="4">No hay pagos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
